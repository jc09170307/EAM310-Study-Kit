<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Qi Whiz! — Diagnosis Pocket Companion Vol. 1</title>
<style>
  :root {
    --navy: #24395c; --jade: #16805f; --maroon: #7a2530; --gold: #c9a226;
    --cream: #fefdf6; --hint: #777777;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%; overflow: hidden; background: #1a1a1a; font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    perspective: 2400px;
  }
  #book {
    position: relative; width: min(88vw, 520px); aspect-ratio: 621 / 875;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
  }
  .page {
    position: absolute; inset: 0; background: var(--cream); background-size: cover;
    backface-visibility: hidden; border-radius: 2px; overflow: hidden;
  }
  .page img { width: 100%; height: 100%; display: block; object-fit: cover; }
  #pageStatic { z-index: 1; }
  #pageFlip {
    z-index: 5; transform-origin: left center; transform: rotateY(0deg);
    transition: transform 0.55s cubic-bezier(.4,.1,.3,1);
    display: none;
  }
  #pageFlip.flipping { display: block; }
  #pageFlip .front, #pageFlip .back {
    position: absolute; inset: 0; backface-visibility: hidden; background: var(--cream);
  }
  #pageFlip .back { transform: rotateY(180deg); }
  #pageFlip img { width: 100%; height: 100%; display: block; object-fit: cover; }

  .tap-zone { position: absolute; top: 0; bottom: 0; width: 28%; z-index: 10; cursor: pointer; }
  .tap-zone.left { left: 0; } .tap-zone.right { right: 0; }

  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px; display: flex; align-items: center;
    justify-content: space-between; padding: 0 14px; background: linear-gradient(rgba(0,0,0,.55), transparent);
    z-index: 50;
  }
  #topbar button {
    background: rgba(255,255,255,0.12); border: none; color: #fff; width: 38px; height: 38px;
    border-radius: 50%; font-size: 16px; cursor: pointer; display:flex; align-items:center; justify-content:center;
  }
  #topbar button:active { background: rgba(255,255,255,0.28); }
  #titleLabel { color: #fff; font-size: 12px; opacity: 0.85; text-align:center; flex:1; }

  #bottombar {
    position: fixed; bottom: 0; left: 0; right: 0; height: 46px; display:flex; align-items:center;
    justify-content: center; gap: 14px; background: linear-gradient(transparent, rgba(0,0,0,.55)); z-index: 50;
  }
  #pageCounter { color: #fff; font-size: 12px; opacity: 0.8; min-width: 70px; text-align:center; }
  #bottombar button, #bottombar a {
    background: rgba(255,255,255,0.12); border:none; color:#fff; width:34px; height:34px;
    border-radius:50%; font-size:14px; cursor:pointer;
  }

  #tocOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 90; display:none;
  }
  #tocOverlay.open { display:block; }
  #tocPanel {
    position: fixed; top:0; right:-320px; width: 300px; height: 100%; background: var(--cream);
    z-index: 91; transition: right 0.3s ease; overflow-y: auto; padding: 16px 14px;
  }
  #tocPanel.open { right: 0; }
  #tocPanel h3 { color: var(--navy); font-size: 15px; margin-bottom: 10px; border-bottom: 2px solid var(--gold); padding-bottom:6px; }
  .toc-part { color: var(--gold); font-weight:700; font-size:11px; letter-spacing:0.5px; text-transform:uppercase;
    margin-top: 14px; margin-bottom: 4px; cursor:pointer; }
  .toc-entry { display:flex; justify-content:space-between; font-size:12.5px; color:#333; padding: 4px 4px 4px 8px;
    cursor:pointer; border-bottom: 1px dotted #ddd; }
  .toc-entry:active { background: #f0e8d0; }
  .toc-entry .pg { color: var(--hint); }
  #tocCover { font-size:12.5px; color:#333; padding:6px 4px; cursor:pointer; border-bottom:1px solid var(--gold);
    margin-bottom: 8px; font-weight:600; }

  #loadingMsg {
    position: fixed; inset:0; display:flex; align-items:center; justify-content:center;
    color: rgba(255,255,255,0.6); font-size: 13px; z-index: 2; pointer-events:none;
  }
</style>
</head>
<body>

<div id="topbar">
  <button id="tocBtn" title="Table of Contents">&#9776;</button>
  <div id="titleLabel">Qi Whiz! — Diagnosis Pocket Companion Vol. 1</div>
  <button id="fsBtn" title="Fullscreen">&#9974;</button>
</div>

<div id="stage">
  <div id="loadingMsg">Loading&hellip;</div>
  <div id="book">
    <div class="page" id="pageStatic"></div>
    <div class="page" id="pageFlip">
      <div class="front"><img id="flipFrontImg"></div>
      <div class="back"><img id="flipBackImg"></div>
    </div>
    <div class="tap-zone left" id="tapLeft"></div>
    <div class="tap-zone right" id="tapRight"></div>
  </div>
</div>

<div id="bottombar">
  <button id="prevBtn">&#8592;</button>
  <div id="pageCounter">1 / 103</div>
  <button id="nextBtn">&#8594;</button>
  <a id="pdfBtn" title="Open searchable PDF" href="#" target="_blank" style="text-decoration:none; display:flex; align-items:center; justify-content:center;">PDF</a>
</div>

<div id="tocOverlay"></div>
<div id="tocPanel">
  <h3>Contents</h3>
  <div id="tocCover">Front Cover</div>
  <div id="tocList"></div>
</div>

<script>
(function(){
  const TOTAL_PAGES = 114;
  const IMG_BASE_CDN = "https://cdn.jsdelivr.net/gh/jc09170307/EAM310-Study-Kit@main/PocketCompanion/flipbook/";
  const IMG_BASE_RAW = "https://raw.githubusercontent.com/jc09170307/EAM310-Study-Kit/main/PocketCompanion/flipbook/";
  const PDF_CDN = "https://cdn.jsdelivr.net/gh/jc09170307/EAM310-Study-Kit@main/PocketCompanion/EAM310_QiWhiz_PocketCompanion_Vol1_Interactive.pdf";
  const PDF_RAW = "https://raw.githubusercontent.com/jc09170307/EAM310-Study-Kit/main/PocketCompanion/EAM310_QiWhiz_PocketCompanion_Vol1_Interactive.pdf";

  const TOC = [{"title": "Part One — Vital Substance Patterns", "page": 10, "entries": [{"title": "Qi Deficiency", "page": 11}, {"title": "Sinking Qi", "page": 12}, {"title": "Qi Stagnation", "page": 13}, {"title": "Rebellious Qi", "page": 14}, {"title": "Blood Deficiency", "page": 15}, {"title": "Blood Stasis — Overview", "page": 16}, {"title": "Qi Stagnation vs. Blood Stasis", "page": 17}, {"title": "Blood Stasis — Liver & Heart", "page": 18}, {"title": "Blood Stasis — Lung, Stomach, Intestines & Uterus", "page": 19}, {"title": "Heat in the Blood", "page": 20}, {"title": "Loss of Blood", "page": 21}, {"title": "Deficiency of Body Fluids", "page": 22}, {"title": "Edema", "page": 23}, {"title": "Phlegm — Substantial vs. Non-Substantial", "page": 24}, {"title": "Types of Substantial Phlegm", "page": 25}, {"title": "Types of Non-Substantial Phlegm", "page": 26}, {"title": "Essence (Jing) Deficiency", "page": 27}]}, {"title": "Part Two — Eight Principles", "page": 28, "entries": [{"title": "Exterior", "page": 29}, {"title": "Interior", "page": 30}, {"title": "Exterior Cold", "page": 31}, {"title": "Exterior Heat", "page": 32}, {"title": "Full Exterior", "page": 33}, {"title": "Empty Exterior", "page": 34}, {"title": "Full Cold", "page": 35}, {"title": "Empty Cold", "page": 36}, {"title": "Full Heat", "page": 37}, {"title": "Empty Heat", "page": 38}, {"title": "Full / Excess", "page": 39}, {"title": "Empty / Deficiency", "page": 40}, {"title": "Yin Pattern", "page": 41}, {"title": "Yang Pattern", "page": 42}, {"title": "False Heat, True Cold", "page": 43}, {"title": "False Cold, True Heat", "page": 44}, {"title": "Cold Exterior, Heat Interior", "page": 45}, {"title": "Heat Exterior, Cold Interior", "page": 46}, {"title": "Heat Above, Cold Below", "page": 47}, {"title": "Combined Heat and Cold", "page": 48}]}, {"title": "Part Three — Pulse Diagnosis", "page": 49, "entries": [{"title": "Components of a Normal Pulse", "page": 50}, {"title": "Width", "page": 50}, {"title": "Depth", "page": 51}, {"title": "Rate", "page": 52}, {"title": "Rhythm", "page": 53}, {"title": "Length", "page": 54}, {"title": "Tension", "page": 55}, {"title": "Shape", "page": 56}, {"title": "Strength", "page": 57}, {"title": "The 28 Qualities", "page": 61}, {"title": "Floating", "page": 61}, {"title": "Deep / Submerged", "page": 63}, {"title": "Slow", "page": 64}, {"title": "Rapid", "page": 65}, {"title": "Empty / Deficient", "page": 66}, {"title": "Full / Excessive", "page": 67}, {"title": "Slippery", "page": 68}, {"title": "Choppy", "page": 69}, {"title": "Long", "page": 70}, {"title": "Short", "page": 71}, {"title": "Overflowing / Flooding", "page": 72}, {"title": "Fine / Thin", "page": 73}, {"title": "Minute / Faint", "page": 74}, {"title": "Tight", "page": 75}, {"title": "Wiry", "page": 76}, {"title": "Slowed-Down / Moderate", "page": 77}, {"title": "Hollow", "page": 78}, {"title": "Leather", "page": 79}, {"title": "Firm / Confined", "page": 80}, {"title": "Soggy", "page": 81}, {"title": "Weak / Frail", "page": 82}, {"title": "Scattered", "page": 83}, {"title": "Hidden", "page": 84}, {"title": "Moving", "page": 85}, {"title": "Hasty", "page": 86}, {"title": "Knotted", "page": 87}, {"title": "Intermittent", "page": 88}, {"title": "Hurried / Racing", "page": 89}]}, {"title": "Part Four — Tongue Diagnosis", "page": 92, "entries": [{"title": "How to Inspect the Tongue", "page": 93}, {"title": "Medications & the Tongue", "page": 94}, {"title": "Tongue-Zang Fu Connections", "page": 95}, {"title": "Three Layers of the Tongue", "page": 96}, {"title": "The Normal Tongue", "page": 97}, {"title": "Pale Tongue", "page": 98}, {"title": "Red Tongue", "page": 99}, {"title": "Red Points & Spots", "page": 100}, {"title": "Purple & Blue Tongue", "page": 101}, {"title": "Black & Gray Tongue", "page": 102}, {"title": "Thin Tongue", "page": 103}, {"title": "Swollen Tongue", "page": 104}, {"title": "Scalloped / Tooth-Marked Tongue", "page": 105}, {"title": "Cracks", "page": 106}, {"title": "Quivering, Moving & Deviated Tongue", "page": 107}, {"title": "Coating Color", "page": 108}, {"title": "Coating Thickness & Distribution", "page": 109}, {"title": "Coating Moisture", "page": 110}, {"title": "Coating Viscosity", "page": 111}, {"title": "Peeling & Rootless Coating", "page": 112}, {"title": "Sublingual Veins", "page": 113}]}];

  function pad(n){ return String(n).padStart(3,'0'); }
  function imgUrl(n){ return IMG_BASE_CDN + "page-" + pad(n) + ".jpg"; }

  let current = 1;
  const pageStatic = document.getElementById('pageStatic');
  const pageFlip = document.getElementById('pageFlip');
  const flipFrontImg = document.getElementById('flipFrontImg');
  const flipBackImg = document.getElementById('flipBackImg');
  const pageCounter = document.getElementById('pageCounter');
  const loadingMsg = document.getElementById('loadingMsg');

  const cache = {};
  function preload(n){
    if(n < 1 || n > TOTAL_PAGES || cache[n]) return;
    const img = new Image();
    img.src = imgUrl(n);
    cache[n] = img;
  }

  function setStatic(n){
    current = n;
    pageStatic.style.backgroundImage = "url('" + imgUrl(n) + "')";
    pageStatic.innerHTML = '<img src="' + imgUrl(n) + '" onload="document.getElementById(\'loadingMsg\').style.display=\'none\'">';
    pageCounter.textContent = n + " / " + TOTAL_PAGES;
    preload(n+1); preload(n+2); preload(n-1);
    try { history.replaceState(null, "", "#p" + n); } catch(e) { /* srcdoc/sandboxed preview: no-op */ }
  }

  let animating = false;
  function flipTo(target, dir){
    if(animating || target < 1 || target > TOTAL_PAGES || target === current) return;
    animating = true;
    if(dir === 'next'){
      flipFrontImg.src = imgUrl(current);
      flipBackImg.src = imgUrl(target);
      pageFlip.style.transformOrigin = 'left center';
      pageFlip.style.transform = 'rotateY(0deg)';
      pageFlip.classList.add('flipping');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        pageFlip.style.transform = 'rotateY(-180deg)';
      }));
    } else {
      flipFrontImg.src = imgUrl(current);
      flipBackImg.src = imgUrl(target);
      pageFlip.style.transformOrigin = 'right center';
      pageFlip.style.transform = 'rotateY(0deg)';
      pageFlip.classList.add('flipping');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        pageFlip.style.transform = 'rotateY(180deg)';
      }));
    }
    setTimeout(() => {
      setStatic(target);
      pageFlip.classList.remove('flipping');
      pageFlip.style.transform = 'rotateY(0deg)';
      animating = false;
    }, 560);
  }

  document.getElementById('tapLeft').addEventListener('click', () => flipTo(current-1, 'prev'));
  document.getElementById('tapRight').addEventListener('click', () => flipTo(current+1, 'next'));
  document.getElementById('prevBtn').addEventListener('click', () => flipTo(current-1, 'prev'));
  document.getElementById('nextBtn').addEventListener('click', () => flipTo(current+1, 'next'));

  document.addEventListener('keydown', (e) => {
    if(e.key === 'ArrowRight') flipTo(current+1, 'next');
    if(e.key === 'ArrowLeft') flipTo(current-1, 'prev');
    if(e.key === 'Escape') closeTOC();
  });

  let touchStartX = null;
  document.getElementById('stage').addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
  document.getElementById('stage').addEventListener('touchend', (e) => {
    if(touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if(Math.abs(dx) > 40){
      if(dx < 0) flipTo(current+1, 'next'); else flipTo(current-1, 'prev');
    }
    touchStartX = null;
  });

  document.getElementById('fsBtn').addEventListener('click', () => {
    if(!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
    else document.exitFullscreen();
  });

  document.getElementById('pdfBtn').href = PDF_RAW;

  // ---------- TOC panel ----------
  const tocOverlay = document.getElementById('tocOverlay');
  const tocPanel = document.getElementById('tocPanel');
  const tocList = document.getElementById('tocList');

  document.getElementById('tocCover').addEventListener('click', () => { flipToPage(1); closeTOC(); });

  TOC.forEach(part => {
    const partEl = document.createElement('div');
    partEl.className = 'toc-part';
    partEl.textContent = part.title;
    partEl.addEventListener('click', () => { flipToPage(part.page); closeTOC(); });
    tocList.appendChild(partEl);
    part.entries.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'toc-entry';
      row.innerHTML = '<span>' + entry.title + '</span><span class="pg">' + entry.page + '</span>';
      row.addEventListener('click', () => { flipToPage(entry.page); closeTOC(); });
      tocList.appendChild(row);
    });
  });

  function flipToPage(n){
    // jump directly (no animation) for TOC navigation across large distances
    setStatic(n);
  }

  function openTOC(){ tocOverlay.classList.add('open'); tocPanel.classList.add('open'); }
  function closeTOC(){ tocOverlay.classList.remove('open'); tocPanel.classList.remove('open'); }
  document.getElementById('tocBtn').addEventListener('click', openTOC);
  tocOverlay.addEventListener('click', closeTOC);

  // ---------- init ----------
  const hashMatch = location.hash.match(/#p(\d+)/);
  const startPage = hashMatch ? Math.min(Math.max(1, parseInt(hashMatch[1])), TOTAL_PAGES) : 1;
  setStatic(startPage);
  preload(2); preload(3);
})();
</script>
</body>
</html>
